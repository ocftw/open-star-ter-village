name: Repository CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/webapp/**'
      - 'homepage/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'fly.toml'
      - 'netlify.toml'
      - '.github/workflows/build.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/update-homepage-visual-baselines.yml'
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}
      homepage: ${{ steps.filter.outputs.homepage }}
      policy: ${{ steps.filter.outputs.policy }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files=$(git ls-tree -r --name-only "$HEAD_SHA")
          else
            changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          webapp=false
          homepage=false
          policy=false

          while IFS= read -r file; do
            case "$file" in
              packages/webapp/*|Dockerfile|.dockerignore|fly.toml|.github/workflows/deploy.yml)
                webapp=true
                ;;
              homepage/*|.github/workflows/update-homepage-visual-baselines.yml)
                homepage=true
                ;;
              netlify.toml)
                homepage=true
                ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                webapp=true
                homepage=true
                ;;
              .github/scripts/validate-pr-evidence.*|.github/workflows/pr-evidence.yml|.github/pull_request_template.md|.github/copilot-instructions.md|CONTRIBUTING.md|AGENTS.md|CLAUDE.md)
                policy=true
                ;;
              .github/workflows/build.yml)
                webapp=true
                homepage=true
                policy=true
                ;;
            esac
          done <<< "$changed_files"

          echo "webapp=$webapp" >> "$GITHUB_OUTPUT"
          echo "homepage=$homepage" >> "$GITHUB_OUTPUT"
          echo "policy=$policy" >> "$GITHUB_OUTPUT"

  webapp:
    name: Webapp baseline
    needs: changes
    if: ${{ needs.changes.outputs.webapp == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm webapp lint
      - run: pnpm webapp exec tsc --noEmit
      - run: pnpm webapp test --runInBand
      - run: pnpm webapp build
      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
        run: pnpm webapp exec playwright install --with-deps chromium
      - run: pnpm webapp e2e

  homepage:
    name: Homepage baseline
    needs: changes
    if: ${{ needs.changes.outputs.homepage == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm homepage lint
      - run: pnpm homepage build
      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
        run: pnpm homepage exec playwright install --with-deps chromium
      - name: Run production browser checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
        run: pnpm homepage test:admin && pnpm homepage test:visual
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-browser-failure
          path: |
            homepage/playwright-report
            homepage/test-results
          if-no-files-found: ignore
          retention-days: 7

  homepage-preview:
    name: Homepage preview smoke
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.homepage == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Determine preview applicability
        id: applicability
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "Netlify preview smoke is not applicable to fork pull requests."
          fi

      - name: Wait for Netlify Deploy Preview
        id: preview
        if: steps.applicability.outputs.applicable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for attempt in {1..120}; do
            status_json=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status")
            preview=$(jq -c '
              [.statuses[] | select(.context == "netlify/openstartervillage/deploy-preview")]
              | sort_by(.created_at)
              | last // empty
            ' <<< "$status_json")

            if [[ -n "$preview" ]]; then
              state=$(jq -r '.state' <<< "$preview")
              target_url=$(jq -r '.target_url // empty' <<< "$preview")
              description=$(jq -r '.description // empty' <<< "$preview")

              case "$state" in
                success)
                  if [[ "$target_url" == https://deploy-preview-*--openstartervillage.netlify.app* ]]; then
                    preview_url=$target_url
                  elif [[ "$description" == "Deploy Preview canceled." && "$target_url" == https://app.netlify.com/projects/openstartervillage/deploys/* ]]; then
                    preview_url="https://deploy-preview-${PR_NUMBER}--openstartervillage.netlify.app"
                    echo "Netlify canceled a duplicate deploy; reusing $preview_url"
                  else
                    echo "Netlify returned an unexpected preview URL: $target_url"
                    exit 1
                  fi
                  echo "url=$preview_url" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                error|failure)
                  echo "Netlify Deploy Preview failed with state: $state"
                  exit 1
                  ;;
              esac
            fi

            sleep 5
          done

          echo "Timed out after 10 minutes waiting for Netlify Deploy Preview."
          exit 1

      - uses: actions/checkout@v4
        if: steps.applicability.outputs.applicable == 'true'
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        if: steps.applicability.outputs.applicable == 'true'

      - name: Use Node.js 24
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        if: steps.applicability.outputs.applicable == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.applicability.outputs.applicable == 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
        run: pnpm homepage exec playwright install --with-deps chromium

      - name: Run preview smoke suite
        if: steps.applicability.outputs.applicable == 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: pnpm homepage test:preview

      - name: Upload preview failure artifacts
        if: failure() && steps.applicability.outputs.applicable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: homepage-preview-smoke-failure
          path: |
            homepage/playwright-report
            homepage/test-results
          if-no-files-found: ignore
          retention-days: 7

  policy:
    name: Evidence validator tests
    needs: changes
    if: ${{ needs.changes.outputs.policy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: node --test .github/scripts/validate-pr-evidence.test.mjs

  required:
    name: Required baseline
    if: ${{ always() }}
    needs: [changes, webapp, homepage, homepage-preview, policy]
    runs-on: ubuntu-latest

    steps:
      - name: Require all applicable baseline jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEBAPP_RESULT: ${{ needs.webapp.result }}
          HOMEPAGE_RESULT: ${{ needs.homepage.result }}
          HOMEPAGE_PREVIEW_RESULT: ${{ needs.homepage-preview.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$WEBAPP_RESULT" "$HOMEPAGE_RESULT" "$HOMEPAGE_PREVIEW_RESULT" "$POLICY_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "An applicable baseline job did not succeed: $result"
              exit 1
            fi
          done

          echo "All applicable baseline jobs passed."
