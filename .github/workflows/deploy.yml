name: Webapp Production Deploy

on:
  workflow_run:
    workflows: ["Webapp CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: fly-deploy-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          deploy_args=(
            --remote-only
            --build-arg SENTRY_ENVIRONMENT=production
            --build-arg "SENTRY_RELEASE=${GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA}"
            --env SENTRY_ENVIRONMENT=production
            --env "SENTRY_RELEASE=${GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA}"
          )

          if [ -n "${SENTRY_DSN:-}" ]; then
            deploy_args+=(--build-arg "SENTRY_DSN=${SENTRY_DSN}")
          fi

          if [ -n "${SENTRY_ORG:-}" ]; then
            deploy_args+=(--build-arg "SENTRY_ORG=${SENTRY_ORG}")
          fi

          if [ -n "${SENTRY_PROJECT:-}" ]; then
            deploy_args+=(--build-arg "SENTRY_PROJECT=${SENTRY_PROJECT}")
          fi

          if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
            deploy_args+=(--build-secret "SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}")
          fi

          flyctl deploy "${deploy_args[@]}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Notify Discord deploy result
        if: ${{ always() }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          content: |
            Webapp production deployment finished with status: ${{ job.status }}
            Commit: ${{ github.event.workflow_run.head_sha }}
            Author: ${{ github.event.workflow_run.head_commit.author.name || github.event.workflow_run.actor.login }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
