name: Fly Deploy

on:
  # TEMP: manual branch deploy for validating deploy notifications before merge.
  # Remove after the Discord notification test passes.
  workflow_dispatch:
  workflow_run:
    workflows: ["Webapp CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: fly-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Notify Discord deploy result
        if: ${{ always() }}
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          content: |
            Fly Deploy finished with status: ${{ job.status }}
            Commit: ${{ github.event.workflow_run.head_sha || github.sha }}
            Author: ${{ github.event.workflow_run.head_commit.author.name || github.event.workflow_run.actor.login || github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
