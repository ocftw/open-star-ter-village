[build]
  base      = "/"
  command   = "pnpm homepage build"
  publish   = "homepage/.next"
  # Skip the build when nothing Netlify serves has changed. Exit 0 cancels.
  # Webapp-only commits no longer rebuild and redeploy the homepage.
  #
  # The -n guard matters: on a context's first build CACHED_COMMIT_REF is unset,
  # and `git diff --quiet <sha> -- paths` would then compare against a clean
  # working tree, exit 0, and silently cancel that first build.
  ignore    = '[ -n "$CACHED_COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- homepage/ netlify/ netlify.toml pnpm-lock.yaml pnpm-workspace.yaml package.json'

[build.environment]
  NODE_VERSION = "24"

# Decap CMS GitHub OAuth handshake lives at /.netlify/functions/{auth,callback}.
# Addressed directly rather than behind a prettier /oauth/* rewrite, so reaching
# the functions never depends on redirect ordering against the Next.js runtime's
# catch-all.
[functions]
  directory = "netlify/functions"
