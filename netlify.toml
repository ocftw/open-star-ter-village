[build]
  base      = "/"
  command   = "pnpm homepage build"
  publish   = "homepage/.next"
  # Skip the build when nothing Netlify serves has changed. Exit 0 cancels.
  # Webapp-only commits no longer rebuild and redeploy the homepage.
  #
  # The -n guard matters: on a context's first build CACHED_COMMIT_REF is unset,
  # and `git diff --quiet <sha> -- paths` would then compare against a clean
  # working tree, exit 0, and silently cancel that first build.
  #
  # The != guard matters too: when a build runs without cache, Netlify sets
  # CACHED_COMMIT_REF equal to COMMIT_REF. Diffing a commit against itself is
  # always quiet, so every cacheless build was canceled, and a canceled build
  # never saves a cache, which left production frozen.
  ignore    = '[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- homepage/ packages/link-analytics/ netlify/ netlify.toml pnpm-lock.yaml pnpm-workspace.yaml package.json'

[build.environment]
  NODE_VERSION = "24"

[context.production.environment]
  NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID = "GTM-N324PT4J"

# Decap CMS GitHub OAuth handshake lives at /.netlify/functions/{auth,callback}.
# Addressed directly rather than behind a prettier /oauth/* rewrite, so reaching
# the functions never depends on redirect ordering against the Next.js runtime's
# catch-all.
[functions]
  directory = "netlify/functions"
