[build]
  base      = "/"
  command   = "pnpm homepage build"
  publish   = "homepage/.next"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

# Decap CMS GitHub OAuth handshake. Redirects are evaluated before the Next.js
# runtime's catch-all, so these paths reach the functions rather than the app.
[[redirects]]
  from   = "/oauth/auth"
  to     = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from   = "/oauth/callback"
  to     = "/.netlify/functions/callback"
  status = 200
